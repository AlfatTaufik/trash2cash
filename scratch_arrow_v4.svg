<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <!-- Hand-drawn arrow marker with open wings like reference -->
    <marker id="curvedArrowHead" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 4 4 L 18 10 L 4 16" fill="none" stroke="#161616" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .curved-pointer-text {
      font-family: 'Highway Motel Sans Regular', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      fill: #161616;
      text-transform: none;
    }
  </style>

  <!-- Looped arrow stroke -->
  <path id="curvedArrowStroke" d="M 195 185 C 198 145 185 118 152 118 C 128 118 118 144 138 165 C 162 185 188 152 170 118 C 152 82 105 76 42 90" 
        fill="none" stroke="#161616" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#curvedArrowHead)"/>

  <!-- Text angled beside the curve -->
  <text class="curved-pointer-text" transform="translate(205, 75) rotate(-44)" text-anchor="middle">
    Masukan sampahmu kedalam sini
  </text>
</svg>