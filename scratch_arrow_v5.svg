<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280">
  <defs>
    <!-- Sharp hand-drawn sketch arrowhead matching reference -->
    <marker id="sketchArrow" viewBox="0 0 24 24" refX="20" refY="12" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M 4 4 L 20 12 L 4 20" fill="none" stroke="#161616" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .curved-pointer-text {
      font-family: 'Highway Motel Sans Regular', 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      fill: #161616;
      text-transform: none;
    }
  </style>

  <!-- Looped arrow stroke -->
  <path d="M 225 250 C 228 195 205 145 165 155 C 135 162 138 205 170 205 C 205 205 225 150 185 108 C 150 72 85 75 32 102" 
        fill="none" stroke="#161616" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sketchArrow)"/>

  <!-- Text parallel to the loop entrance, clear of stroke -->
  <text class="curved-pointer-text" transform="translate(255, 115) rotate(-52)" text-anchor="middle">
    Masukan sampahmu kedalam sini
  </text>
</svg>