<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="380" height="260">
  <defs>
    <!-- Custom hand-drawn style arrowhead -->
    <marker id="handArrow" viewBox="0 0 20 20" refX="16" refY="10" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 2 3 L 17 10 L 2 17 L 6 10 Z" fill="#161616" stroke="#161616" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <!-- Path dedicated for text follow -->
    <path id="textTrack" d="M 340 235 C 330 170 295 105 240 70 C 190 40 110 40 45 76" fill="none"/>
  </defs>

  <style>
    .arrow-text {
      font-family: 'Highway Motel Sans Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      fill: #161616;
      text-transform: none;
    }
  </style>

  <!-- Looped arrow line -->
  <path d="M 300 235 C 305 185 275 125 225 100 C 180 80 155 130 190 160 C 225 185 260 135 225 95 C 190 50 105 45 42 78" 
        fill="none" stroke="#161616" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#handArrow)"/>

  <!-- Text along the curve above the loop -->
  <text class="arrow-text" dy="-12">
    <textPath href="#textTrack" startOffset="20%">
      Masukan sampahmu kedalam sini
    </textPath>
  </text>
</svg>