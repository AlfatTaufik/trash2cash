<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#222"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#222;stroke-width:1}
      .ln{fill:none;stroke:#222;stroke-width:1}
      .a{fill:none;stroke:#222;stroke-width:1;marker-end:url(#arr)}
      .dash{stroke:#222;stroke-width:1;stroke-dasharray:3 3}
      text{font-family:Arial,Helvetica,sans-serif;font-size:11px;text-anchor:middle;dominant-baseline:middle;fill:#111}
      .sm{font-size:10px}
      .lbl{font-size:10px;text-anchor:start}
      .lane{font-size:17px}
    </style>
  </defs>

  <!-- Frame & swimlanes -->
  <rect x="0" y="0" width="1000" height="920" fill="#fff"/>
  <rect class="box" x="10" y="10" width="980" height="900"/>
  <line class="ln" x1="930" y1="10" x2="930" y2="910"/>
  <line class="dash" x1="10" y1="260" x2="990" y2="260"/>
  <line class="dash" x1="10" y1="340" x2="990" y2="340"/>
  <line class="dash" x1="10" y1="520" x2="990" y2="520"/>
  <line class="dash" x1="10" y1="640" x2="990" y2="640"/>
  <text class="lane" x="960" y="135" transform="rotate(-90 960 135)">Empathize</text>
  <text class="lane" x="960" y="300" transform="rotate(-90 960 300)">Define</text>
  <text class="lane" x="960" y="430" transform="rotate(-90 960 430)">Ideate</text>
  <text class="lane" x="960" y="580" transform="rotate(-90 960 580)">Prototype</text>
  <text class="lane" x="960" y="775" transform="rotate(-90 960 775)">Testing</text>

  <!-- ===== EMPATHIZE ===== -->
  <ellipse class="box" cx="85" cy="45" rx="40" ry="15"/>
  <text x="85" y="45">Mulai</text>
  <path class="a" d="M85,60 V85"/>

  <rect class="box" x="28" y="85" width="114" height="50"/>
  <text x="85" y="97">Identifikasi masalah</text>
  <text x="85" y="110">sampah anorganik &amp;</text>
  <text x="85" y="123">kebutuhan pengguna</text>

  <path class="ln" d="M142,110 H180"/>
  <path class="ln" d="M180,47 V172"/>
  <path class="a" d="M180,47 H205"/>
  <path class="a" d="M180,110 H205"/>
  <path class="a" d="M180,172 H205"/>

  <rect class="box" x="205" y="25" width="160" height="44"/>
  <text x="285" y="47">Survei masyarakat</text>

  <rect class="box" x="205" y="88" width="160" height="44"/>
  <text x="285" y="103.5">Studi literatur (jurnal</text>
  <text x="285" y="116.5">pengelolaan sampah &amp; AI)</text>

  <rect class="box" x="205" y="150" width="160" height="44"/>
  <text x="285" y="165.5">Pengumpulan data sekunder</text>
  <text x="285" y="178.5">(DLH &amp; SIPSN Kota Bogor)</text>

  <path class="a" d="M365,47 H400 V102"/>
  <path class="a" d="M365,110 H392"/>
  <path class="a" d="M365,172 H400 V118"/>
  <circle class="box" cx="400" cy="110" r="8"/>
  <path class="a" d="M408,110 H440"/>

  <rect class="box" x="440" y="88" width="150" height="44"/>
  <text x="515" y="103.5">Analisis kebutuhan &amp;</text>
  <text x="515" y="116.5">masalah utama pengguna</text>
  <path class="a" d="M590,110 H630"/>

  <rect class="box" x="630" y="88" width="140" height="44"/>
  <text x="700" y="103.5">Validasi hasil survei</text>
  <text x="700" y="116.5">dan informasi</text>
  <path class="a" d="M700,132 V175"/>

  <rect class="box" x="630" y="175" width="140" height="50"/>
  <text x="700" y="187">Mendapatkan informasi</text>
  <text x="700" y="200">kebutuhan pengguna</text>
  <text x="700" y="213" font-style="italic">(Empathy Map)</text>
  <path class="a" d="M700,225 V245 H465 V275"/>

  <!-- ===== DEFINE ===== -->
  <rect class="box" x="370" y="275" width="190" height="44"/>
  <text x="465" y="290.5">Mendefinisikan masalah</text>
  <text x="465" y="303.5">utama pengguna (POV &amp; HMW)</text>
  <path class="a" d="M560,297 H900 V465 H810"/>

  <!-- ===== IDEATE ===== -->
  <rect class="box" x="190" y="360" width="140" height="44"/>
  <text x="260" y="375.5">Mengembangkan solusi</text>
  <text x="260" y="388.5">alternatif</text>
  <path class="a" d="M260,360 V297 H370"/>
  <path class="a" d="M330,382 H400"/>

  <rect class="box" x="400" y="360" width="140" height="44"/>
  <text x="470" y="382">Menyesuaikan ide</text>
  <path class="a" d="M540,382 H900"/>

  <rect class="box" x="640" y="440" width="170" height="50"/>
  <text x="725" y="452">Mengembangkan ide solusi:</text>
  <text x="725" y="465">Website T2C, AI Scan</text>
  <text x="725" y="478">sampah &amp; Eco-Coins</text>
  <path class="a" d="M640,465 H560"/>

  <rect class="box" x="400" y="443" width="160" height="44"/>
  <text x="480" y="458.5">Menentukan fitur &amp; desain</text>
  <text x="480" y="471.5">yang ada di aplikasi T2C</text>
  <path class="a" d="M400,465 H325"/>

  <polygon class="box" points="260,427 325,465 260,503 195,465"/>
  <text class="sm" x="260" y="459">Ide menyelesaikan</text>
  <text class="sm" x="260" y="471">masalah?</text>
  <path class="a" d="M260,427 V404"/>
  <text class="lbl" x="266" y="416">Tidak</text>
  <path class="a" d="M195,465 H155 V555"/>
  <text class="lbl" x="168" y="456">Ya</text>

  <!-- ===== PROTOTYPE ===== -->
  <rect class="box" x="75" y="555" width="160" height="50"/>
  <text x="155" y="573.5">Penerapan solusi ke dalam</text>
  <text x="155" y="586.5">prototipe web &amp; AI Scan</text>
  <path class="a" d="M235,580 H285"/>

  <rect class="box" x="285" y="558" width="150" height="44"/>
  <text x="360" y="573.5">Uji coba kecil</text>
  <text x="360" y="586.5" font-style="italic">(low fidelity test)</text>
  <path class="a" d="M435,580 H485"/>

  <rect class="box" x="485" y="558" width="170" height="44"/>
  <text x="570" y="573.5">Perbaikan fitur dan</text>
  <text x="570" y="586.5">tampilan aplikasi</text>
  <path class="a" d="M570,602 V620"/>

  <!-- ===== TRANSISI: UJI PAKAR & VALIDITAS (ANTARA PROTOTYPE & TESTING) ===== -->
  <rect class="box" x="475" y="620" width="190" height="46"/>
  <text x="570" y="636.5">Uji <tspan font-style="italic">expert</tspan> &amp; validitas</text>
  <text x="570" y="650.5">(pakar persampahan &amp; TI)</text>
  <path class="a" d="M665,643 H725"/>

  <!-- Decision: Terdapat revisi dari pakar? -->
  <polygon class="box" points="775,615 825,643 775,671 725,643"/>
  <text class="sm" x="775" y="637">Terdapat</text>
  <text class="sm" x="775" y="649">revisi?</text>

  <!-- Cabang Ya: Kembali ke Prototype -->
  <path class="a" d="M775,615 V596"/>
  <text class="lbl" x="781" y="607">Ya</text>
  <rect class="box" x="705" y="558" width="140" height="38"/>
  <text class="sm" x="775" y="571">Mempertimbangkan</text>
  <text class="sm" x="775" y="584">masukan pakar</text>
  <path class="a" d="M705,577 H655"/>

  <!-- Cabang Tidak: Selesai / Dokumentasi Hasil Prototipe Final -->
  <path class="a" d="M775,671 V705"/>
  <text class="lbl" x="781" y="685">Tidak</text>

  <rect class="box" x="700" y="705" width="150" height="42"/>
  <text x="775" y="721">Dokumentasi hasil</text>
  <text x="775" y="734">prototipe final</text>
  <path class="a" d="M775,747 V775"/>

  <ellipse class="box" cx="775" cy="790" rx="40" ry="15"/>
  <text x="775" y="790">Selesai</text>

  <!-- ===== TESTING: DESKRIPSI SINGKAT & BATASAN RUANG LINGKUP ===== -->
  <!-- Panah konektor rencana lanjutan dari prototipe tervalidasi ke tahap testing -->
  <path class="a" stroke-dasharray="3 3" d="M700,726 H565"/>
  <text x="633" y="706" font-size="9.5px" fill="#555">Rencana riset</text>
  <text x="633" y="717" font-size="9.5px" fill="#555">lanjutan</text>

  <!-- Box Deskripsi Singkat Testing -->
  <rect class="box" x="35" y="695" width="530" height="155" rx="4" ry="4" stroke-dasharray="5 4"/>
  <text x="300" y="718" font-size="12px" font-weight="bold">Tahap Pengujian (Testing) — Deskripsi &amp; Batasan Ruang Lingkup</text>
  <line class="ln" x1="55" y1="732" x2="545" y2="732"/>
  <text class="sm" x="300" y="752">Pada penelitian ini, tahap pengujian langsung ke masyarakat luas (seperti uji coba lapangan dan</text>
  <text class="sm" x="300" y="768">evaluasi System Usability Scale / SUS) tidak dilaksanakan, karena batasan ruang lingkup riset</text>
  <text class="sm" x="300" y="784">difokuskan hingga finalisasi prototipe fungsional (web &amp; AI Scan) yang tervalidasi pakar.</text>
  <text class="sm" x="300" y="806">Rancangan instrumen dan pengujian pengguna skala luas disiapkan sebagai agenda penelitian</text>
  <text class="sm" x="300" y="822" font-style="italic">tahap lanjutan (future work) pasca-validasi prototipe.</text>
</svg>
